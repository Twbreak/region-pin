[project]
name = "regionpin"
version = "1.0.0"
description = "用 Windows 防火牆白名單，讓遊戲只連到指定機房"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
regionpin = "regionpin.__main__:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
